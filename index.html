<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List - Supabase + Vercel Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <div class="container">
      <div class="margin-rule"></div>
      <div class="content">
        <p class="kicker">Việc cần làm</p>
        <h1>Todo List</h1>
        <p class="subtitle">HTML/JS + Supabase + GitHub Actions CI/CD + Vercel</p>

        <form id="todo-form">
          <input type="text" id="task-input" placeholder="Nhập công việc mới…" required />
          <button type="submit">Thêm</button>
        </form>

        <ul id="todo-list"></ul>

        <p id="status" class="status"></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
