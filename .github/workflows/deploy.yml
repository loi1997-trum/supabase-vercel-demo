name: Deploy to Vercel

# Chạy workflow này mỗi khi có commit push lên nhánh main
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      # 0. DEBUG TẠM THỜI: kiểm tra độ dài secrets (không lộ giá trị thật)
      - name: Debug secrets length
        run: |
          echo "VERCEL_TOKEN length: ${#VERCEL_TOKEN}"
          echo "VERCEL_ORG_ID length: ${#VERCEL_ORG_ID}"
          echo "VERCEL_ORG_ID value (first/last char check): [${VERCEL_ORG_ID:0:5}...${VERCEL_ORG_ID: -5}]"
          echo "VERCEL_PROJECT_ID length: ${#VERCEL_PROJECT_ID}"
          echo "VERCEL_PROJECT_ID value (first/last char check): [${VERCEL_PROJECT_ID:0:5}...${VERCEL_PROJECT_ID: -5}]"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # 1. Lấy code từ repository về
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài đặt Vercel CLI
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # 3. Kéo cấu hình môi trường từ Vercel (dùng token để xác thực)
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # 4. Build project (với static site bước này gần như là copy/prepare)
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # 5. Deploy bản build lên Vercel (production)
      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}